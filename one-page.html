<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni Typing HERO - Lite</title>
  <style>
    body {
      background-color: #0f141a;
      color: #eeeeee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    #game-wrapper {
      box-shadow: 0 0 50px rgba(255, 69, 0, 0.2);
      border: 4px solid #8b0000;
      line-height: 0;
      position: relative;
    }

    canvas {
      background-color: #1c2630;
      image-rendering: pixelated;
    }

    .instructions {
      margin-top: 20px;
      color: #d4af37;
      font-size: 14px;
      text-shadow: 1px 1px #000;
    }
  </style>
</head>

<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>
  <div class="instructions">請輸入咒語攻擊，打錯字會激怒妖怪！</div>

  <script>
    /**
     * 遊戲配置
     */
    const CONFIG = {
      width: 600,
      height: 600,
      pixelSize: 4,
      monsterMaxHP: 10,
      maxHearts: 3,
      rageThreshold: 5, // 打錯 5 次觸發反擊
      groundY: 320
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = CONFIG.width;
    canvas.height = CONFIG.height;

    /**
     * 遊戲狀態
     */
    let gameState = {
      gold: 0,
      hearts: CONFIG.maxHearts,
      isGameOver: false,
      monster: {
        hp: CONFIG.monsterMaxHP,
        rage: 0,
        x: 300,
        y: 280,
        status: 'alive',
        opacity: 1.0,
        rotation: 0
      },
      currentWord: "LOADING",
      typedIndex: 0,
      lastKeyPressed: "",
      shakeTime: 0,
      screenFlash: 0,
      particles: [],
      fireballs: [],
      enemyProjectiles: [], // 怪物發射的子彈
      coins: [],
      isLoading: true
    };

    /**
     * 特效物件類別
     */
    class Fireball {
      constructor(startX, startY, targetX, targetY) {
        this.x = startX; this.y = startY;
        this.targetX = targetX; this.targetY = targetY;
        this.speed = 12;
        const angle = Math.atan2(targetY - startY, targetX - startX);
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.alive = true;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (Math.random() > 0.3) gameState.particles.push(new Particle(this.x, this.y, "#ff4500", 0.5));
        const dx = this.x - this.targetX, dy = this.y - this.targetY;
        if (Math.sqrt(dx * dx + dy * dy) < 30) { this.alive = false; explode(this.targetX, this.targetY, "#ff8c00"); }
      }
      draw() {
        ctx.fillStyle = "#ff4500"; ctx.fillRect(this.x - 6, this.y - 6, 12, 12);
      }
    }

    class EnemyProjectile {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.vy = 8;
        this.alive = true;
      }
      update() {
        this.y += this.vy;
        if (Math.random() > 0.5) gameState.particles.push(new Particle(this.x, this.y, "#9932cc", 0.3));
        if (this.y > 500) { // 擊中玩家區域
          this.alive = false;
          gameState.hearts--;
          gameState.screenFlash = 10;
          gameState.shakeTime = 15;
          if (gameState.hearts <= 0) gameState.isGameOver = true;
        }
      }
      draw() {
        ctx.fillStyle = "#9400d3";
        ctx.fillRect(this.x - 8, this.y - 8, 16, 16);
        ctx.fillStyle = "#fff";
        ctx.fillRect(this.x - 3, this.y - 3, 6, 6);
      }
    }

    class Particle {
      constructor(x, y, color, speedMult = 1.0) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 10 * speedMult;
        this.vy = (Math.random() - 0.5) * 10 * speedMult;
        this.life = 1.0;
        this.decay = 0.03 + Math.random() * 0.02;
        this.color = color;
      }
      update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
      draw() {
        ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 4, 4); ctx.globalAlpha = 1.0;
      }
    }

    function explode(x, y, color) {
      gameState.shakeTime = 8;
      for (let i = 0; i < 15; i++) gameState.particles.push(new Particle(x, y, color, 1.2));
    }

    class Coin {
      constructor(x, y) {
        this.x = x; this.y = y; this.vy = -8; this.vx = (Math.random() - 0.5) * 4; this.life = 1.0;
      }
      update() {
        this.x += this.vx; this.y += this.vy; this.vy += 0.5;
        if (this.y > CONFIG.groundY) this.life -= 0.05;
      }
      draw() { ctx.fillStyle = "#ffd700"; ctx.fillRect(this.x, this.y, 8, 8); }
    }

    /**
     * 邏輯函數
     */
    async function fetchNewWord() {
      gameState.isLoading = true;
      try {
        const response = await fetch('https://random-word-api.herokuapp.com/word?number=1');
        const data = await response.json();
        gameState.currentWord = data[0].toUpperCase();
        gameState.typedIndex = 0;
      } catch (e) {
        gameState.currentWord = "SYSTEM";
        gameState.typedIndex = 0;
      }
      gameState.isLoading = false;
    }

    function drawMonster() {
      const m = gameState.monster;
      ctx.save();
      ctx.translate(m.x, m.y);
      if (gameState.shakeTime > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
      // 怪物反擊前的發光預警
      if (m.rage >= CONFIG.rageThreshold - 1) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#9400d3";
      }
      ctx.rotate(m.rotation);
      ctx.globalAlpha = m.opacity;
      // 身體
      ctx.fillStyle = "#8b0000"; ctx.fillRect(-24, -48, 48, 48);
      // 角
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.moveTo(-16, -48); ctx.lineTo(-24, -64); ctx.lineTo(-8, -48); ctx.fill();
      ctx.beginPath(); ctx.moveTo(16, -48); ctx.lineTo(24, -64); ctx.lineTo(8, -48); ctx.fill();
      // 臉
      ctx.fillStyle = "#fff"; ctx.fillRect(-12, -35, 8, 8); ctx.fillRect(4, -35, 8, 8);
      ctx.fillStyle = "#000"; ctx.fillRect(-8, -31, 4, 4); ctx.fillRect(8, -31, 4, 4);
      // 嘴 (受傷時會變形)
      ctx.fillStyle = m.rage >= CONFIG.rageThreshold - 1 ? "#ff0000" : "#000";
      ctx.fillRect(-6, -18, 12, m.rage >= CONFIG.rageThreshold - 1 ? 6 : 2);
      ctx.restore();
    }

    /**
 * 繪製環境與 UI
 */
    function drawEnvironment() {
      // 地面
      ctx.fillStyle = "#0a0a0a";
      ctx.fillRect(0, CONFIG.groundY, 600, 300);

      // 日式鳥居裝飾線
      ctx.fillStyle = "#8b0000";
      ctx.fillRect(0, 400, 600, 8); // 橫樑
      ctx.fillRect(50, 400, 20, 200); // 柱子左
      ctx.fillRect(530, 400, 20, 200); // 柱子右

      // 金幣與血條
      ctx.fillStyle = "#d4af37";
      ctx.font = "20px 'Courier New'";
      ctx.textAlign = "left";
      ctx.fillText(`KOBAN: ${gameState.gold}`, 30, 40);

      // 血條
      const bw = 200;
      ctx.fillStyle = "#333";
      ctx.fillRect(370, 25, bw, 15);
      ctx.fillStyle = "#ff4500";
      ctx.fillRect(370, 25, (gameState.monster.hp / CONFIG.monsterMaxHP) * bw, 15);
      ctx.strokeStyle = "#d4af37";
      ctx.strokeRect(370, 25, bw, 15);
    }

    function drawUI() {
      // 生命值 (心形)
      for (let i = 0; i < CONFIG.maxHearts; i++) {
        ctx.fillStyle = i < gameState.hearts ? "#ff4444" : "#333";
        // 畫一個簡單的像素心
        const hX = 30 + i * 35;
        const hY = 70;
        ctx.fillRect(hX, hY, 10, 10);
        ctx.fillRect(hX - 5, hY - 5, 10, 10);
        ctx.fillRect(hX + 5, hY - 5, 10, 10);
      }

      ctx.fillStyle = "#d4af37"; ctx.font = "20px 'Courier New'"; ctx.textAlign = "left";
      ctx.fillText(`KOBAN: ${gameState.gold}`, 30, 40);

      // 怪物的血條與反擊條
      const bw = 200;
      // HP Bar
      ctx.fillStyle = "#333"; ctx.fillRect(370, 25, bw, 12);
      ctx.fillStyle = "#ff4500"; ctx.fillRect(370, 25, (gameState.monster.hp / CONFIG.monsterMaxHP) * bw, 12);
      // Rage Bar (反擊值)
      ctx.fillStyle = "#222"; ctx.fillRect(370, 42, bw, 6);
      ctx.fillStyle = "#9400d3"; ctx.fillRect(370, 42, (gameState.monster.rage / CONFIG.rageThreshold) * bw, 6);
      ctx.strokeStyle = "#d4af37"; ctx.strokeRect(370, 25, bw, 23);

      // 單字
      if (!gameState.isGameOver) {
        ctx.textAlign = "center"; ctx.font = "bold 40px 'Courier New'";
        const word = gameState.currentWord;
        const startX = 300 - (word.length * 28) / 2;
        for (let i = 0; i < word.length; i++) {
          ctx.fillStyle = i < gameState.typedIndex ? "#ff4500" : "#555";
          ctx.fillText(word[i], startX + i * 28, 380);
        }
      } else {
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, 0, 600, 600);
        ctx.fillStyle = "#ff0000"; ctx.font = "bold 60px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("戰死沙場", 300, 250);
        ctx.fillStyle = "#fff"; ctx.font = "20px 'Courier New'";
        ctx.fillText("按下任何鍵重新開始", 300, 320);
      }

      // 鍵盤區
      const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
      rows.forEach((row, rIdx) => {
        const xStart = 300 - (row.length * 45) / 2;
        for (let i = 0; i < row.length; i++) {
          const char = row[i];
          const isPressed = gameState.lastKeyPressed === char;
          const x = xStart + i * 45;
          const y = 450 + rIdx * 45;
          ctx.fillStyle = isPressed ? "#ff4500" : "#1a1a1a";
          ctx.fillRect(x, y, 35, 35);
          ctx.strokeStyle = "#8b0000";
          ctx.strokeRect(x, y, 35, 35);
          ctx.fillStyle = "#fff";
          ctx.font = "14px Arial";
          ctx.fillText(char, x + 17.5, y + 22);
        }
      });
    }

    function update() {
      if (gameState.isGameOver) return;

      gameState.fireballs.forEach(f => f.update());
      gameState.enemyProjectiles.forEach(p => p.update());
      gameState.particles.forEach(p => p.update());
      gameState.coins.forEach(c => c.update());

      // 過濾死掉的物件
      gameState.fireballs = gameState.fireballs.filter(f => f.alive);
      gameState.enemyProjectiles = gameState.enemyProjectiles.filter(p => p.alive);
      gameState.particles = gameState.particles.filter(p => p.life > 0);
      gameState.coins = gameState.coins.filter(c => c.life > 0);

      const m = gameState.monster;
      if (m.status === 'dying') {
        m.rotation += 0.1; m.opacity -= 0.02;
        if (m.opacity <= 0) {
          m.status = 'alive'; m.hp = CONFIG.monsterMaxHP; m.opacity = 1.0; m.rotation = 0;
          fetchNewWord();
        }
      }

      if (gameState.shakeTime > 0) gameState.shakeTime--;
      if (gameState.screenFlash > 0) gameState.screenFlash--;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 背景
      ctx.fillStyle = "#1c2630"; ctx.fillRect(0, 0, 600, 600);
      ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0, CONFIG.groundY, 600, 300);

      // 受傷閃紅
      if (gameState.screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 0, 0, ${gameState.screenFlash / 20})`;
        ctx.fillRect(0, 0, 600, 600);
      }

      gameState.coins.forEach(c => c.draw());
      drawMonster();
      gameState.fireballs.forEach(f => f.draw());
      gameState.enemyProjectiles.forEach(p => p.draw());
      gameState.particles.forEach(p => p.draw());

      // 鳥居裝飾
      ctx.fillStyle = "#8b0000"; ctx.fillRect(0, 400, 600, 8);
      ctx.fillRect(50, 400, 20, 200); ctx.fillRect(530, 400, 20, 200);
      // drawEnvironment()
      drawUI();
      requestAnimationFrame(draw);
    }

    function resetGame() {
      gameState.hearts = CONFIG.maxHearts;
      gameState.gold = 0;
      gameState.isGameOver = false;
      gameState.monster.hp = CONFIG.monsterMaxHP;
      gameState.monster.rage = 0;
      gameState.typedIndex = 0;
      fetchNewWord();
    }

    window.addEventListener('keydown', (e) => {
      if (gameState.isGameOver) {
        resetGame();
        return;
      }
      if (gameState.isLoading || gameState.monster.status === 'dying') return;

      const key = e.key.toUpperCase();
      if (key.length !== 1) return; // 忽略功能鍵

      gameState.lastKeyPressed = key;
      setTimeout(() => { if (gameState.lastKeyPressed === key) gameState.lastKeyPressed = ""; }, 100);

      if (key === gameState.currentWord[gameState.typedIndex]) {
        // 打對了
        gameState.typedIndex++;
        gameState.fireballs.push(new Fireball(300 + (Math.random() - 0.5) * 100, 500, 300, 240));

        if (gameState.typedIndex >= gameState.currentWord.length) {
          gameState.monster.hp--;
          gameState.coins.push(new Coin(300, 240));
          if (gameState.monster.hp <= 0) {
            gameState.monster.status = 'dying';
            gameState.gold++;
            explode(300, 240, "#fff");
          } else {
            fetchNewWord();
          }
        }
      } else {
        // 打錯了：增加怪物怒氣
        gameState.monster.rage++;
        gameState.shakeTime = 5;

        // 觸發反擊
        if (gameState.monster.rage >= CONFIG.rageThreshold) {
          gameState.monster.rage = 0;
          gameState.enemyProjectiles.push(new EnemyProjectile(300, 240));
          // 怪物攻擊閃光
          explode(300, 240, "#9400d3");
        }
      }
    });

    setInterval(update, 1000 / 60);
    fetchNewWord();
    draw();
  </script>
</body>

</html>
