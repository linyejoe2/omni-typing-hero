<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>Omni Typing HERO V1.0.0</title>
  <link rel="stylesheet" href="style.css">
  <link id="favicon" rel="icon" type="image/png" href="">
  <meta name="description" content="在異世界裡打字也可以玩 RPG Game!">
</head>

<body>
  <!-- left panel -->
  <div id="playerPanel" class="panel">
    <!-- 1. 角色點陣圖 -->
    <div class="char-avatar-container">
      <canvas id="avatarCanvas" width="64" height="64"></canvas>
    </div>

    <!-- 2. 基本資料與統計 -->
    <div class="panel-header">
      <h3 id="panel-nickname">冒險者</h3>
      <span id="panel-job-lv">Lv.1 劍客</span>
    </div>

    <div class="stats-grid">
      <div class="stat-item"><span>Avg WPM</span>
        <stronfg id="stat-avg-wpm">0</strong>
      </div>
      <div class="stat-item"><span>Max WPM</span><strong id="stat-max-wpm">0</strong></div>
      <div class="stat-item"><span>Accuracy</span><strong id="stat-accuracy">0</strong></div>
    </div>

    <div class="stats-grid-2">
      <div class="stat-item"><span>Max Combo</span><strong id="stat-max-combo">0</strong></div>
      <div class="stat-item"><span>Total Kills</span><strong id="stat-total-kills">0</strong></div>
    </div>

    <!-- 3. Tab Bar -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="attr">屬性</button>
      <button class="tab-btn" data-tab="bag">背包</button>
      <button class="tab-btn" data-tab="set">設定</button>
    </div>

    <!-- 4. Tab Content -->
    <div class="tab-content" id="tab-container">
      <div id="tab-attr" class="tab-pane active">
        <!-- 這裡放 STR, VIT, AGI 等 -->
        <div class="attr-list" id="attr-list"></div>
      </div>
      <div id="tab-bag" class="tab-pane">
        <div class="inventory-grid" id="inventory-grid"></div>
      </div>
      <div id="tab-set" class="tab-pane">
        <button id="btn-reborn" class="btn btn-danger">轉生</button>
        <button id="btn-logout" class="btn">登出世界</button>

        <button id="bgm-toggle" class="bgm-ctrl btn">
          <span class="icon">♪</span>
          <span class="status">BGM OFF</span>
        </button>
      </div>
    </div>
  </div>
  <!-- right panle -->
  <div id="leaderboardPanel" class="panel">
    <h3 class="lb-title">TOP RANKING</h3>
    <div class="lb-header">
      <span class="col-rank">#</span>
      <span class="col-player">PLAYER</span>
      <span class="col-time">TIME</span>
      <span class="col-stats">STATS</span>
    </div>
    <div id="lb-list">
      <!-- 這裡由 JS 動態生成內容 -->
    </div>
  </div>


  <!-- 登入/註冊畫面 -->
  <div id="authScreen" class="hidden screen-overlay">
    <div class="glass-panel">
      <h1 class="pixel-title">Omni Typing HERO</h1>
      <div class="input-group">
        <input type="email" id="email" class="pixel-input" placeholder="冒險者信箱">
        <input type="password" id="password" class="pixel-input" placeholder="密碼">
      </div>
      <div class="button-group">
        <button id="btn-login" class="btn btn-primary">進入世界</button>
        <button id="btn-signup" class="btn">註冊帳號</button>
      </div>
    </div>
  </div>

  <!-- 角色創建畫面 -->
  <div id="creatorScreen" class="hidden screen-overlay">
    <div class="glass-panel">
      <h1 class="pixel-title">創建角色</h1>
      <div style="
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      font-family: Arial, sans-serif;
      padding: 20px;
      ">
        <div id="jobDefaultAttributeList" style="flex: 1;">
          <!-- <div><div>VIT: </div><div class="progress-bar"><div class="progress-fill" style="width: 20%;"></div></div></div>
            <div><div>STR: </div><div class="progress-bar"><div class="progress-fill" style="width: 20%;"></div></div></div>
            <div><div>CRI: </div><div class="progress-bar"><div class="progress-fill" style="width: 20%;"></div></div></div>
            <div><div>DEF: </div><div class="progress-bar"><div class="progress-fill" style="width: 20%;"></div></div></div>
            <div><div>AGI: </div><div class="progress-bar"><div class="progress-fill" style="width: 20%;"></div></div></div> -->
        </div>
        <div style="flex: 1;">
          <canvas id="creatorCanvas" width="120px" height="90px"></canvas>
        </div>
        <div id="heroInfo" style="flex: 1;"></div>
      </div>
      <div class="input-group">
        <input type="text" id="nickname" class="pixel-input" placeholder="角色名稱">
        <select id="jobSelect" class="pixel-input">
          <option value="mage">法師 (Mage)</option>
          <option value="defender" selected>重盾 (Defender)</option>
          <!-- <option value="archer">弓手 (Archer)</option> -->
        </select>
        <select id="genderSelect" class="pixel-input">
          <option value='MALE'>男性</option>
          <option value='FEMALE'>女性</option>
        </select>
      </div>
      <button id="btn-start" class="btn btn-primary">開啟征途</button>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <!-- <div id="pauseHint">ESC 暫停</div> -->
    <canvas id="gameCanvas"></canvas>
  </div>

  <script type="module" src="src/main.js"></script>
</body>

</html>
