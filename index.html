<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Omni Typing HERO</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (模組化版本) -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body>
    <div id="auth-screen">
        <div class="auth-box">
            <h1>像素冒險</h1>
            <input type="email" id="email" placeholder="信箱">
            <input type="password" id="password" placeholder="密碼">
            <button id="btn-login">進入世界</button>
            <button id="btn-signup">註冊帳號</button>
        </div>
    </div>

    <div id="char-creator" class="hidden">
        <h2>創建角色</h2>
        <input type="text" id="nickname" placeholder="冒險者名稱">
        <select id="job-select">
            <option value="SWORDSMAN">劍客 (雙手大劍)</option>
            <option value="MAGE">魔法師 (元素魔法)</option>
            <option value="ARCHER">弓箭手 (長弓)</option>
            <option value="TANKER">肉盾 (單手斧)</option>
        </select>
        <select id="gender-select">
            <option value="MALE">男</option>
            <option value="FEMALE">女</option>
        </select>
        <button id="btn-start">啟動</button>
    </div>

    <div id="game-screen" class="hidden">
        <canvas id="gameCanvas"></canvas>
        <div class="game-ui">
            <div id="word-display"></div>
            <div id="status-bar"></div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
