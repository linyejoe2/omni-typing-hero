<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>Omni Typing HERO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- left panel -->
  <div id="playerPanel" class="modern-panel">
    <!-- 1. 角色點陣圖 -->
    <div class="char-avatar-container">
      <canvas id="avatarCanvas" width="64" height="64"></canvas>
    </div>

    <!-- 2. 基本資料與統計 -->
    <div class="panel-header">
      <h3 id="panel-nickname">冒險者</h3>
      <span id="panel-job-lv">Lv.1 劍客</span>
    </div>

    <div class="stats-grid">
      <div class="stat-item"><span>Avg WPM</span><strong id="stat-avg-wpm">0</strong></div>
      <div class="stat-item"><span>Max WPM</span><strong id="stat-max-wpm">0</strong></div>
      <div class="stat-item"><span>Accuracy</span><strong id="stat-accuracy">0</strong></div>
    </div>

    <div class="stats-grid-2">
      <div class="stat-item"><span>Max Combo</span><strong id="stat-max-combo">0</strong></div>
      <div class="stat-item"><span>Total Kills</span><strong id="stat-total-kills">0</strong></div>
    </div>

    <!-- 3. Tab Bar -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="attr">屬性</button>
      <button class="tab-btn" data-tab="bag">背包</button>
      <button class="tab-btn" data-tab="set">設定</button>
    </div>

    <!-- 4. Tab Content -->
    <div class="tab-content" id="tab-container">
      <div id="tab-attr" class="tab-pane active">
        <!-- 這裡放 STR, VIT, AGI 等 -->
        <div class="attr-list" id="attr-list"></div>
      </div>
      <div id="tab-bag" class="tab-pane">
        <div class="inventory-grid" id="inventory-grid"></div>
      </div>
      <div id="tab-set" class="tab-pane">
        <button id="btn-logout" class="btn">登出世界</button>

        <button id="bgm-toggle" class="bgm-ctrl btn">
          <span class="icon">♪</span>
          <span class="status">BGM OFF</span>
        </button>
      </div>
    </div>
  </div>
  <!-- right panle -->
  <div id="leaderboard-side">
    <h3 class="lb-title">TOP RANKING</h3>
    <div class="lb-header">
      <span class="col-rank">#</span>
      <span class="col-player">PLAYER</span>
      <span class="col-time">TIME</span>
      <span class="col-stats">STATS</span>
    </div>
    <div id="lb-list">
      <!-- 這裡由 JS 動態生成內容 -->
    </div>
  </div>


  <div id="authScreen">
    <div class="auth-box">
      <h1>像素冒險</h1>
      <input type="email" id="email" placeholder="信箱">
      <input type="password" id="password" placeholder="密碼">
      <button id="btn-login">進入世界</button>
      <button id="btn-signup">註冊帳號</button>
    </div>
  </div>

  <div id="charCreatorScreen" class="hidden">
    <h2>創建角色</h2>
    <input type="text" id="nickname" placeholder="冒險者名稱">
    <select id="job-select">
      <!-- <option value="SWORDSMAN">劍客 (雙手大劍)</option> -->
      <option value="MAGE">魔法師 (元素魔法)</option>
      <!-- <option value="ARCHER">弓箭手 (長弓)</option> -->
      <!-- <option value="TANKER">肉盾 (單手斧)</option> -->
    </select>
    <select id="gender-select">
      <option value="MALE">男</option>
      <option value="FEMALE">女</option>
    </select>
    <button id="btn-start">啟動</button>
  </div>

  <div id="gameScreen" class="hidden">
    <!-- <div id="pauseHint">ESC 暫停</div> -->
    <canvas id="gameCanvas"></canvas>
  </div>

  <script type="module" src="src/main.js"></script>
</body>

</html>
